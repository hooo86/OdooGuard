{% extends "base.html" %}
{% block title %}Connexion{% endblock %}
{% block anonymous %}
<div class="login-wrap">
  <section class="login card">
    <div class="brand">
      <img src="/static/logo-mark.svg" alt="" width="40" height="45">
      <span><span class="wordmark"><span class="wm-odoo">Odoo</span><span class="wm-guard">Guard</span></span>
      <span class="brand-site">{{ site }} · sauvegarde et restauration</span></span>
    </div>
    {% if error %}<p class="banner banner-critical" role="alert">{{ error }}</p>{% endif %}
    <form method="post" action="/login">
      <label>Identifiant <input name="username" autocomplete="username" required autofocus></label>
      <label>Mot de passe <input name="password" type="password" autocomplete="current-password" required></label>
      <button type="submit" class="primary">Se connecter</button>
    </form>
  </section>
</div>
{% endblock %}
