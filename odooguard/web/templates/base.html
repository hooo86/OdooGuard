<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}OdooGuard{% endblock %} · {{ site }}</title>
  <link rel="stylesheet" href="/static/app.css">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <meta name="htmx-config" content='{"includeIndicatorStyles": false}'>
  <script src="/static/htmx-1.9.12.min.js" defer></script>
  <script src="/static/app.js" defer></script>
</head>
<body>
{% if user %}
<header class="topbar">
  <a class="brand" href="/">OdooGuard <span class="muted">{{ site }}</span></a>
  <nav>
    <a href="/" {% if request.url.path == '/' %}aria-current="page"{% endif %}>État</a>
    <a href="/backups" {% if request.url.path == '/backups' %}aria-current="page"{% endif %}>Sauvegardes</a>
    <a href="/history" {% if request.url.path == '/history' %}aria-current="page"{% endif %}>Historique</a>
    <a href="/alerts" {% if request.url.path == '/alerts' %}aria-current="page"{% endif %}>Alertes</a>
    <a href="/audit" {% if request.url.path == '/audit' %}aria-current="page"{% endif %}>Audit</a>
  </nav>
  <form method="post" action="/logout" class="logout">
    <span class="muted">{{ user }}</span> <button type="submit" class="link">Déconnexion</button>
  </form>
</header>
{% endif %}
<main>
{% block content %}{% endblock %}
</main>
<footer class="muted">OdooGuard {{ version }} · lecture seule — aucune action n'est lancée depuis cette page</footer>
</body>
</html>
