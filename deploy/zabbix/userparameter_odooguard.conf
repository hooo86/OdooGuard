# /etc/zabbix/zabbix_agent2.d/userparameter_odooguard.conf  (sur OdooGuard)
# Lit uniquement /var/lib/odooguard-public/status.json (0644, sans secret).
# Clés utilisées par le modèle deploy/zabbix/zbx_template_odooguard.yaml
UserParameter=odooguard.discovery,/usr/local/bin/odooguard-zabbix discovery
UserParameter=odooguard.overall,/usr/local/bin/odooguard-zabbix overall
UserParameter=odooguard.status.age,/usr/local/bin/odooguard-zabbix age
UserParameter=odooguard.rpo[*],/usr/local/bin/odooguard-zabbix rpo "$1"
UserParameter=odooguard.component[*],/usr/local/bin/odooguard-zabbix component "$1" "$2"
