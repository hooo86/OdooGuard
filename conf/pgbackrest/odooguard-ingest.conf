# =============================================================================
# /etc/pgbackrest/odooguard-ingest.conf  sur OdooGuard  (root:odooguard 640)
# Configuration « locale » du même dépôt, utilisée pour :
#   * archive-push des WAL reçus par pg_receivewal (pg1-path = copie de pg_control) ;
#   * les restaurations dans la zone de travail d'OdooGuard (pg1-path surchargé).
# =============================================================================
[global]
repo1-path=/srv/odooguard/pgbackrest
repo1-cipher-type=aes-256-cbc
repo1-cipher-pass=@CIPHER_PASS@
compress-type=zst
compress-level=3
log-path=/var/log/pgbackrest
# Répertoire de travail asynchrone propre à OdooGuard (pas /var/spool/pgbackrest)
spool-path=/var/lib/odooguard/pgbackrest-spool
log-level-console=warn
log-level-file=info
lock-path=/tmp/pgbackrest-ingest
[lnhc]
pg1-path=/var/lib/odooguard/pgshadow
