# =============================================================================
# /etc/pgbackrest/reader.conf  sur OdooGuard  (pgbr-reader:pgbr-reader 600)
# Utilisé par le compte en LECTURE SEULE pgbr-reader, quand server01 ou la VM
# de test restaurent (restore, archive-get) en se connectant à OdooGuard.
# pgbr-reader est membre du groupe odooguard : droits r-x sur le dépôt,
# jamais w. Il ne peut ni écrire, ni modifier, ni supprimer une sauvegarde.
# =============================================================================
[global]
repo1-path=/srv/odooguard/pgbackrest
repo1-cipher-type=aes-256-cbc
repo1-cipher-pass=@CIPHER_PASS@
log-path=/var/log/pgbackrest-reader
lock-path=/tmp/pgbackrest-reader
log-level-file=info
