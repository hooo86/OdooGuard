# =============================================================================
# /etc/postgresql/15/main/conf.d/odooguard.conf  sur server01
# (inclus par « include_dir = 'conf.d' », présent par défaut sous Debian)
#
# Paramètres exigeant un REDÉMARRAGE de PostgreSQL : archive_mode,
# listen_addresses (et wal_level / max_wal_senders / max_replication_slots
# s'ils étaient modifiés auparavant). Les autres : rechargement suffit.
# =============================================================================

# Écoute aussi sur l'IP du serveur, pour le flux de réplication d'OdooGuard.
# Le pare-feu et pg_hba.conf limitent l'accès à l'IP d'OdooGuard. [REDÉMARRAGE]
listen_addresses = 'localhost,192.168.8.80'

# Niveau de journalisation suffisant pour la sauvegarde physique (défaut en 15).
wal_level = replica

# pgBackRest exige archive_mode=on et un archive_command contenant « pgbackrest ».
# Les WAL ne sont PAS poussés par server01 : ils sont tirés par OdooGuard
# (pg_receivewal + slot). La commande ne fait donc rien et réussit toujours :
# aucun risque d'accumulation de WAL si OdooGuard est arrêté (c'est le slot,
# borné ci-dessous, qui retient les WAL). [REDÉMARRAGE]
archive_mode = on
archive_command = '/bin/true # pgbackrest : WAL collectes en pull par OdooGuard (pg_receivewal)'

# Bascule de segment WAL au plus toutes les 5 min s'il y a eu de l'activité :
# le dépôt pgBackRest n'a jamais plus de 5 min de retard, même si Odoo est
# peu actif (le segment en cours, lui, est déjà sur OdooGuard en continu).
# Coût : segments partiellement remplis, très bien compressés par zstd. [rechargement]
archive_timeout = 300

# Réplication : 10 par défaut, suffisant (1 pour pg_receivewal + 2 pour la sauvegarde).
max_wal_senders = 10
max_replication_slots = 10

# Garde-fou : si OdooGuard est arrêté longtemps, le slot ne retient pas plus de
# 20 Go de WAL (le disque de server01 ne se remplit jamais à cause de lui).
# Au-delà, le slot est invalidé : alerte « wal_status = lost », il faudra une
# nouvelle sauvegarde complète. [À VÉRIFIER : espace libre sous /var/lib/postgresql]
max_slot_wal_keep_size = 20GB

# Compression des pages complètes dans les WAL : moins de volume à transférer.
wal_compression = lz4
